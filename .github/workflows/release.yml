name: Release

# Every push to main that touches the app releases a minor bump (v0.3.0 → v0.4.0).
# Also runs from the Actions tab ("Run workflow", pick a bump) or on a pushed v* tag.
# Runs the full E2E suite first; the tag and release are only created if it passes.
# Tags created by the release use GITHUB_TOKEN, so they don't re-trigger this workflow.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "design/**"
      - ".github/**"
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: minor
      dry_run:
        description: Dry run (build and test, don't publish)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Write access to mikedelgaudio/homebrew-tap only (a deploy key). The cask step skips without it.
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          echo "Using $XCODE"
          swift --version

      - name: Decide version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            LATEST="$(git tag --list 'v*' --sort=-v:refname | head -1)"
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            case "${{ inputs.bump || 'minor' }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              *)     PATCH=$((PATCH + 1)) ;;
            esac
            TAG="v$MAJOR.$MINOR.$PATCH"
            # Local only for now: bundle.sh reads the version from it. Pushed with the release.
            git tag "$TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: E2E suite
        run: python3 e2e/run.py

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ steps.version.outputs.tag }}
          path: e2e/artifacts/
          if-no-files-found: ignore

      - name: Build DMG
        id: dmg
        run: echo "path=$(scripts/make-dmg.sh | tail -1)" >> "$GITHUB_OUTPUT"

      - name: Upload DMG (dry run)
        if: inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ steps.version.outputs.tag }}
          path: ${{ steps.dmg.outputs.path }}

      - name: Publish release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.dmg.outputs.path }}" \
            --target "$GITHUB_SHA" \
            --title "Break Buddy ${{ steps.version.outputs.tag }}" \
            --generate-notes \
            --notes "**Install** (macOS 15+, Apple silicon or Intel): \`brew install --cask mikedelgaudio/tap/break-buddy\` — or download the DMG below and drag Break Buddy to Applications. First launch: System Settings → Privacy & Security → Open Anyway (not notarized yet)."

      - name: Update Homebrew cask
        if: ${{ !inputs.dry_run && env.TAP_DEPLOY_KEY != '' }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          VERSION="${TAG#v}"
          SHA="$(shasum -a 256 "$DMG" | cut -d' ' -f1)"
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:mikedelgaudio/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/break-buddy.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "break-buddy $VERSION"
          git push
